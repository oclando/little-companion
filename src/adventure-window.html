<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>记忆林地 · 角色冒险</title><link rel="stylesheet" href="adventure-window.css"></head>
<body><header class="reader-header"><div><span class="eyebrow">记忆林地 / 角色共读</span><h1 id="title">正在打开旅程…</h1></div><div class="header-actions"><label>字号<select id="font-size"><option value="16">标准</option><option value="19">大字</option><option value="22">特大</option></select></label><button id="pause">暂停并关闭</button></div></header>
<div class="reader-shell"><aside class="route-panel"><div class="route-heading"><h2>旅程路线</h2><span id="progress"></span></div><div id="party" class="party"></div><p id="targets"></p><button id="change-sources">更换词源 / 多组记忆</button><div id="route"></div><p class="route-note">答对本关指定数量的不同单词，才能前进。关闭窗口会保留当前题和剧情。</p></aside><main class="reading"><details class="voice-panel"><summary>系统语音 · 单词发音与角色朗读</summary><div id="voice-options"></div><button id="voice-stop">停止朗读</button><p id="voice-status" role="status"></p></details><div id="status" role="status"></div><p id="error" role="alert" hidden></p><div id="feed" class="feed" aria-label="剧情与对白"></div><footer class="reader-footer"><button id="resume" class="secondary">继续记忆试炼</button><button id="scene" class="primary">继续角色剧情 · API</button><button id="stop" hidden>停止生成</button><form id="action-form"><input id="action" maxlength="4000" placeholder="写下你的回应或故事中的行动……" aria-label="你的行动"><button class="primary">发送</button></form><small>剧情由角色生成；关卡通过与学习成绩由程序判定。</small></footer></main></div>
<dialog id="quiz"><div class="quiz-head"><span id="quiz-progress"></span><button id="quiz-pause" aria-label="暂停答题">×</button></div><h2 id="quiz-title"></h2><div id="flashcard"></div><p id="quiz-feedback" role="status"></p><button id="word-speak" class="secondary">🔊 单词发音</button><form id="quiz-form"></form><p id="quiz-source" class="quiz-note"></p><p class="quiz-note">每次作答会保存到独立学习履历。</p><button id="quiz-change-sources">更换词源 / 多组记忆</button></dialog>
<script src="system-speech.js"></script><script src="adventure-window.js"></script></body></html>
