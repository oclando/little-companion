<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>角色聊天 · 小伙伴</title><link rel="stylesheet" href="adventure-window.css"><link rel="stylesheet" href="chat-window.css"></head>
<body><header class="reader-header"><div><span class="eyebrow">COMPANION / 日常陪伴</span><h1 id="title">正在打开聊天…</h1></div><div class="header-actions"><label>字号<select id="font-size"><option value="16">标准</option><option value="19">大字</option><option value="22">特大</option></select></label><button id="hide">收起聊天</button></div></header>
<div class="reader-shell"><aside class="route-panel"><h2>在场的伙伴</h2><div id="party" class="party"></div><label class="chat-label">当前回复角色<select id="speaker"></select></label><label class="chat-label"><input type="checkbox" id="group" checked>多人轮流回应</label><details class="world-info"><summary>当前世界</summary><p id="world"></p></details><h2>角色私人记忆</h2><p class="route-note">仅供当前回复角色在本存档使用。选择消息的“记住”，或手动保存。</p><div id="memories"></div><button id="add-memory">＋ 保存一条记忆</button></aside>
<main class="reading"><details class="voice-panel"><summary>系统语音 · 角色朗读</summary><div id="voice-options"></div><button id="voice-stop">停止朗读</button><p id="voice-status" role="status"></p></details><p id="status" role="status"></p><p id="error" role="alert" hidden></p><div id="feed" class="feed" aria-label="聊天记录"></div><footer class="reader-footer"><form id="compose"><textarea id="input" maxlength="24000" rows="3" placeholder="和伙伴说说今天，或写下故事里的行动……" aria-label="聊天消息"></textarea><div class="compose-actions"><small>Enter 发送 · Shift+Enter 换行</small><button type="button" id="continue">继续回应</button><button type="button" id="stop" hidden>停止生成</button><button id="send" class="primary">发送</button></div></form><small>聊天与主程序共用原存档。收起窗口后，记录和进行中的回应会保留。</small></footer></main></div>
<dialog id="memory-editor"><h2 id="memory-title">保存角色记忆</h2><form id="memory-form"><label>归属角色<select id="memory-owner"></select></label><textarea id="memory-text" rows="7" maxlength="12000" required></textarea><p id="memory-error" role="alert"></p><div class="compose-actions"><button type="button" id="memory-close">取消</button><button class="primary">保存</button></div></form></dialog>
<script src="system-speech.js"></script><script src="chat-window.js"></script></body></html>
